services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./server
    restart: unless-stopped
    environment:
      # Datasource creds are derived from the POSTGRES_* vars so they can't drift.
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      SCRAPER_URL: ${SCRAPER_URL}
      ADMIN_API_KEY: ${ADMIN_API_KEY}
      # Market tuning (optional; defaults applied if unset in .env).
      FIGHTER_SEED_PRICE: ${FIGHTER_SEED_PRICE:-1250}
      FIGHTER_SEED_SHARES: ${FIGHTER_SEED_SHARES:-1000}
      PORTFOLIO_SNAPSHOTS_PER_HOUR: ${PORTFOLIO_SNAPSHOTS_PER_HOUR:-1}
      # Salary: amount in sub-units, interval in days (1 = daily, 14 = biweekly).
      SALARY_AMOUNT: ${SALARY_AMOUNT:-50000}
      SALARY_INTERVAL_DAYS: ${SALARY_INTERVAL_DAYS:-14}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      scrape:
        condition: service_started

  scrape:
    build:
      context: ./scrape
    restart: unless-stopped
    ports:
      - "5001:5001"

  frontend:
    build:
      context: ./client
    restart: unless-stopped
    environment:
      BACKEND_URL: ${BACKEND_URL}
      SITE_URL: ${FRONTEND_URL}
      NODE_ENV: production
    ports:
      - "3000:3000"
    depends_on:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:3000/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  # Autonomous AI trading agents. Provisions ~10 bot accounts via the backend's
  # admin endpoint, then trades through the public API to keep the market alive.
  # Runs on a heuristic fallback if GEMINI_API_KEY is unset.
  agents:
    build:
      context: ./agents
    restart: unless-stopped
    environment:
      # RUN_WITH_AI=0 disables all AI trading (the service idles); 1 runs it.
      RUN_WITH_AI: ${RUN_WITH_AI:-1}
      BACKEND_URL: http://backend:8080
      ADMIN_API_KEY: ${ADMIN_API_KEY}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash}
    depends_on:
      backend:
        condition: service_started

volumes:
  postgres-data:
