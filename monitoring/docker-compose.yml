# Prometheus + Grafana that scrape the backend's /actuator/prometheus endpoint.
# Start the app first (docker compose up, or ./mvnw spring-boot:run), then:
#
#   docker compose -f monitoring/docker-compose.yml up
#
# Grafana: http://localhost:3001  (anonymous admin — no login)
# Prometheus: http://localhost:9090
services:
  prometheus:
    image: prom/prometheus:latest
    restart: unless-stopped
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana:latest
    restart: unless-stopped
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
    volumes:
      - ./grafana-datasource.yml:/etc/grafana/provisioning/datasources/datasource.yml:ro
    ports:
      - "3001:3000"
    depends_on:
      - prometheus
