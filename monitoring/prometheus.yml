global:
  scrape_interval: 5s

scrape_configs:
  - job_name: fighter-market
    metrics_path: /actuator/prometheus
    static_configs:
      # Actuator runs on its own management port (9091), not the main app port
      # (8080). docker compose maps 9091, and `./mvnw spring-boot:run` listens
      # there too. Override via MANAGEMENT_PORT must be reflected here.
      - targets: ["host.docker.internal:9091"]
