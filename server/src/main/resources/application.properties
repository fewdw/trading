spring.application.name=server

# Load URLs/secrets from a local .env when present (ignored if missing, e.g. in
# containers where the values come from the environment instead).
spring.config.import=optional:file:.env[.properties]

# Base URL of the scraper service. Provided by .env locally and by the
# environment (docker-compose) in containers -- never hardcoded here.
scraper.base-url=${SCRAPER_URL}

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/app}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:app}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:app}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# One-time schema cleanup: drop the legacy email columns/table left behind when
# auth was reduced to username + password. Hibernate's "update" never drops
# things, and the old users.email column is NOT NULL, so without this an insert
# without an email would fail. Statements are idempotent (IF EXISTS) and run
# after Hibernate (defer=true) so the table is guaranteed to exist first. Safe
# to delete once it has run against every environment.
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true

# Honor the platform-assigned $PORT (Railway/Heroku set it) so the public router
# can reach us; fall back to 8080 locally and in docker-compose.
server.port=${PORT:8080}
# Bind on "::" (IPv6 + IPv4 dual-stack) so the service is reachable over
# Railway's private network, which uses IPv6 for service-to-service DNS.
# Harmless locally / in docker-compose, where peers connect over IPv4.
server.address=::

# Surface ResponseStatusException reasons (e.g. "insufficient funds") in the
# JSON error body so clients can tell distinct 4xx cases apart.
server.error.include-message=always

# Shared secret for the /api/admin/** endpoints, sent as the X-Admin-Api-Key
# header. Sourced from the ADMIN_API_KEY env var; blank => admin disabled.
admin.api-key=${ADMIN_API_KEY:}

# Origins allowed to open the /ws WebSocket (comma-separated). In production set
# WS_ALLOWED_ORIGINS to the frontend's public URL so only it can connect; blank
# or "*" allows any origin (the default, fine for local dev).
websocket.allowed-origins=${WS_ALLOWED_ORIGINS:*}

# --- Market seeding (IPO) ------------------------------------------------
# Applied to each NEW fighter when it's first listed: the per-share seed price
# and how many shares the treasury mints + lists for it. Seed price is in
# sub-units (1 coin = 100), so 1250 = 12.50 coins. Changing these only affects
# fighters listed afterwards, not ones already seeded.
fighter.seed-price=${FIGHTER_SEED_PRICE:1250}
fighter.seed-shares=${FIGHTER_SEED_SHARES:1000}

# How many portfolio snapshots to capture per hour (1 = hourly, 2 = every 30
# min, 4 = every 15 min). Powers the "Portfolio over time" chart on profiles.
portfolio.snapshot.per-hour=${PORTFOLIO_SNAPSHOTS_PER_HOUR:1}

# --- Salary ---------------------------------------------------------------
# Flat salary paid to every user, and how often. Amount is in sub-units
# (1 coin = 100; 50000 = 500 coins). Interval is in days: 1 = daily, 2 = every
# other day, 14 = every two weeks. Always paid at 06:00 in salary.zone.
salary.amount=${SALARY_AMOUNT:50000}
salary.interval-days=${SALARY_INTERVAL_DAYS:14}
salary.zone=${SALARY_ZONE:UTC}

# --- Observability -------------------------------------------------------
# Actuator runs on its OWN port (default 9091), NOT the main app port. On
# Railway only the main $PORT gets a public domain, so this keeps health,
# metrics + prometheus reachable over the private network (and locally) while
# never exposing them to the public internet. Prometheus scrapes this port
# directly. Override with MANAGEMENT_PORT if 9091 is taken.
management.server.port=${MANAGEMENT_PORT:9091}
management.endpoints.web.exposure.include=health,info,prometheus,metrics
management.endpoint.health.probes.enabled=true
# Publish a latency histogram + precomputed percentiles for order placement so
# Prometheus/Grafana (and a quick /actuator/metrics read) can show P99.
management.metrics.distribution.percentiles-histogram.engine.order.placement=true
management.metrics.distribution.percentiles.engine.order.placement=0.5,0.95,0.99

# Structured (JSON) logs to stdout — opt in for production by setting
# LOG_STRUCTURED_FORMAT=ecs (or logstash/gelf). Blank keeps human-readable logs
# locally and in tests.
logging.structured.format.console=${LOG_STRUCTURED_FORMAT:}

# --- Rate limits (configurable so a load test isn't throttled) -----------
# Defaults match the previous hard-coded values. For benchmarking, relax via
# RATELIMIT_* / SIGNUP_RATELIMIT_* env vars (see loadtest/README.md).
ratelimit.capacity=${RATELIMIT_CAPACITY:300}
ratelimit.refill-per-second=${RATELIMIT_REFILL_PER_SECOND:10}
signup.ratelimit.burst=${SIGNUP_RATELIMIT_BURST:5}
signup.ratelimit.per-hour=${SIGNUP_RATELIMIT_PER_HOUR:5}
