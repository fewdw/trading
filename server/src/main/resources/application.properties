spring.application.name=server

# Load URLs/secrets from a local .env when present (ignored if missing, e.g. in
# containers where the values come from the environment instead).
spring.config.import=optional:file:.env[.properties]

# Base URL of the scraper service. Provided by .env locally and by the
# environment (docker-compose) in containers -- never hardcoded here.
scraper.base-url=${SCRAPER_URL}

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/app}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:app}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:app}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

server.port=8080
