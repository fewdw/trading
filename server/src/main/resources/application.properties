spring.application.name=server

# Load URLs/secrets from a local .env when present (ignored if missing, e.g. in
# containers where the values come from the environment instead).
spring.config.import=optional:file:.env[.properties]

# Base URL of the scraper service. Provided by .env locally and by the
# environment (docker-compose) in containers -- never hardcoded here.
scraper.base-url=${SCRAPER_URL}

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/app}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:app}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:app}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# One-time schema cleanup: drop the legacy email columns/table left behind when
# auth was reduced to username + password. Hibernate's "update" never drops
# things, and the old users.email column is NOT NULL, so without this an insert
# without an email would fail. Statements are idempotent (IF EXISTS) and run
# after Hibernate (defer=true) so the table is guaranteed to exist first. Safe
# to delete once it has run against every environment.
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true

# Honor the platform-assigned $PORT (Railway/Heroku set it) so the public router
# can reach us; fall back to 8080 locally and in docker-compose.
server.port=${PORT:8080}
# Bind on "::" (IPv6 + IPv4 dual-stack) so the service is reachable over
# Railway's private network, which uses IPv6 for service-to-service DNS.
# Harmless locally / in docker-compose, where peers connect over IPv4.
server.address=::

# Surface ResponseStatusException reasons (e.g. "insufficient funds") in the
# JSON error body so clients can tell distinct 4xx cases apart.
server.error.include-message=always

# Shared secret for the /api/admin/** endpoints, sent as the X-Admin-Api-Key
# header. Sourced from the ADMIN_API_KEY env var; blank => admin disabled.
admin.api-key=${ADMIN_API_KEY:}
